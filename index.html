<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planta 3D — Casa</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#eef2f7;color:#0f172a;overflow:hidden}
  #app{position:fixed;inset:0}
  #scene{position:absolute;inset:0}
  .panel{position:absolute;left:12px;top:12px;z-index:10;width:min(360px,calc(100% - 24px));background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid #cbd5e1;border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(15,23,42,.12)}
  .title{font-weight:800;font-size:16px;margin-bottom:3px}.sub{font-size:12px;color:#475569;line-height:1.35}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{border:1px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:9px;padding:9px 11px;font-weight:700;cursor:pointer}
  button.active{background:#0f172a;color:#fff;border-color:#0f172a}
  .legend{margin-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px;color:#334155}
  .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
  .info{position:absolute;right:12px;bottom:12px;z-index:10;background:rgba(15,23,42,.86);color:#fff;padding:8px 10px;border-radius:10px;font-size:11px;line-height:1.4}
  @media(max-width:560px){.panel{font-size:13px}.legend{grid-template-columns:1fr}.info{left:12px;right:auto;max-width:calc(100% - 24px)}}
</style>
</head>
<body>
<div id="app">
  <div id="scene"></div>
  <div class="panel">
    <div class="title">Planta 3D — versão base</div>
    <div class="sub">Modelo paramétrico reconstruído da planta enviada. Lote: 25,54 m; pé-direito: 3,00 m; telhado de fibrocimento branco.</div>
    <div class="row">
      <button id="btn3d" class="active">3D</button>
      <button id="btnTop">Vista superior</button>
      <button id="btnRoof">Telhado</button>
      <button id="btnWalls" class="active">Paredes</button>
      <button id="btnReset">Centralizar</button>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:#edd3ad"></i>Sala / cozinha</span>
      <span><i class="dot" style="background:#79d1c2"></i>Quarto infantil</span>
      <span><i class="dot" style="background:#eebeb8"></i>Quarto</span>
      <span><i class="dot" style="background:#b7b4c4"></i>Banheiros</span>
      <span><i class="dot" style="background:#a6a594"></i>Varanda</span>
      <span><i class="dot" style="background:#a7d7af"></i>Área livre</span>
    </div>
  </div>
  <div class="info">Arraste para girar • pinça/roda para zoom • dois dedos/botão direito para mover</div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const mount = document.getElementById('scene');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef2f7);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 150);
camera.position.set(23, 24, 24);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
mount.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.07;
controls.target.set(12.5,0,4.8);
controls.minDistance=7;
controls.maxDistance=70;
controls.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xffffff,0x64748b,2.2));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(8,24,10); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-25;sun.shadow.camera.right=25;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;
scene.add(sun);
const world=new THREE.Group(); scene.add(world);
const floors=new THREE.Group(); world.add(floors);
const walls=new THREE.Group(); world.add(walls);
const roof=new THREE.Group(); world.add(roof);
const sx=25.54/(1338-95);
const sy=8.69/(727-279);
const ox=95, oy=727;
const X=p=>(p-ox)*sx;
const Z=p=>(oy-p)*sy;
const lotPts=[[95,726],[83,280],[1320,184],[1338,680]].map(([x,y])=>new THREE.Vector2(X(x),Z(y)));
const lotShape=new THREE.Shape(lotPts);
const lotGeo=new THREE.ShapeGeometry(lotShape);
lotGeo.rotateX(-Math.PI/2);
const lot=new THREE.Mesh(lotGeo,new THREE.MeshStandardMaterial({color:0xa7d7af,roughness:1}));
lot.receiveShadow=true; lot.position.y=-.03; world.add(lot);
function floorRect(name,x1,y1,x2,y2,color){
 const w=X(x2)-X(x1), d=Z(y1)-Z(y2);
 const g=new THREE.BoxGeometry(w,.055,d);
 const m=new THREE.MeshStandardMaterial({color,roughness:.92});
 const o=new THREE.Mesh(g,m); o.name=name;
 o.position.set((X(x1)+X(x2))/2,.02,(Z(y1)+Z(y2))/2);
 o.receiveShadow=true; floors.add(o); return o;
}
function floorPoly(name,pts,color){
 const s=new THREE.Shape(pts.map(([x,y])=>new THREE.Vector2(X(x),Z(y))));
 const g=new THREE.ShapeGeometry(s); g.rotateX(-Math.PI/2);
 const o=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:.92}));
 o.name=name;o.position.y=.025;o.receiveShadow=true;floors.add(o);return o;
}
floorRect('Varanda',280,269,369,628,0xa6a594);
floorRect('Banheiro social',280,628,402,699,0xb7b4c4);
floorRect('Quarto infantil',433,269,612,410,0x79d1c2);
floorRect('Quarto',612,269,853,428,0xeebeb8);
floorRect('Banheiro',853,269,952,412,0xb7b4c4);
floorPoly('Sala e cozinha',[[369,269],[433,269],[433,410],[612,410],[612,510],[813,510],[813,699],[402,699],[402,628],[369,628]],0xedd3ad);
floorPoly('Pátio interno',[[612,428],[853,428],[853,699],[813,699],[813,510],[612,510]],0xa7d7af);
const slab=floorRect('Área 4 x 5 m',1127,208,1324,445,0x9ca3af);
slab.material.color.set(0x9ca3af);
const H=3.0, T=.14;
function wallSeg(x1,y1,x2,y2,h=H){
 const ax=X(x1), az=Z(y1), bx=X(x2), bz=Z(y2);
 const dx=bx-ax,dz=bz-az,len=Math.hypot(dx,dz);
 const g=new THREE.BoxGeometry(len,h,T);
 const o=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xf8fafc,roughness:.88}));
 o.position.set((ax+bx)/2,h/2,(az+bz)/2);
 o.rotation.y=-Math.atan2(dz,dx);
 o.castShadow=true;o.receiveShadow=true;walls.add(o);return o;
}
[[280,269,952,269],[280,269,280,699],[280,699,853,699],[952,269,952,412],[853,269,853,412],[853,428,853,699],[369,269,369,628],[402,628,402,699],[280,628,402,628],[433,269,433,410],[433,410,612,410],[612,269,612,510],[612,428,853,428],[612,510,813,510],[813,510,813,699],[853,412,952,412]].forEach(v=>wallSeg(...v));
function doorMark(x1,y1,x2,y2){
 const ax=X(x1),az=Z(y1),bx=X(x2),bz=Z(y2),len=Math.hypot(bx-ax,bz-az);
 const o=new THREE.Mesh(new THREE.BoxGeometry(len,.02,.055),new THREE.MeshBasicMaterial({color:0x334155}));
 o.position.set((ax+bx)/2,.07,(az+bz)/2);o.rotation.y=-Math.atan2(bz-az,bx-ax);world.add(o);
}
doorMark(350,330,369,330);doorMark(540,410,580,410);doorMark(790,428,830,428);doorMark(813,545,813,585);doorMark(390,628,402,650);
const roofMat=new THREE.MeshStandardMaterial({color:0xf8fafc,roughness:.62,metalness:.03,side:THREE.DoubleSide,transparent:true,opacity:.92});
const rx1=X(270),rx2=X(962),rz1=Z(258),rz2=Z(710);
const rw=rx2-rx1, rd=rz1-rz2;
const rg=new THREE.BoxGeometry(rw,.08,rd);
const ro=new THREE.Mesh(rg,roofMat);
ro.position.set((rx1+rx2)/2,H+.20,(rz1+rz2)/2);
ro.rotation.z=THREE.MathUtils.degToRad(1.7);
ro.castShadow=true; roof.add(ro);roof.visible=false;
const grid=new THREE.GridHelper(34,34,0x64748b,0xcbd5e1);grid.position.set(12.5,-.06,5); world.add(grid);
function label(text,x,y){
 const c=document.createElement('canvas');c.width=512;c.height=128;
 const ctx=c.getContext('2d');ctx.fillStyle='rgba(15,23,42,.78)';ctx.fillRect(8,22,496,84);
 ctx.fillStyle='#fff';ctx.font='700 34px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,256,64);
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
 s.position.set(X(x),.22,Z(y));s.scale.set(2.5,.62,1);world.add(s);
}
label('VARANDA',325,455);label('QUARTO INFANTIL',525,345);label('QUARTO',733,350);label('BANHEIRO',902,340);label('SALA / COZINHA',585,575);label('BANHEIRO',340,662);label('ÁREA LIVRE',1090,535);
function set3d(){camera.fov=42;camera.updateProjectionMatrix();camera.position.set(23,24,24);controls.target.set(12.5,0,4.8);controls.update();document.getElementById('btn3d').classList.add('active');document.getElementById('btnTop').classList.remove('active');}
function setTop(){camera.position.set(12.5,35,4.8);controls.target.set(12.5,0,4.8);controls.update();document.getElementById('btnTop').classList.add('active');document.getElementById('btn3d').classList.remove('active');}
document.getElementById('btn3d').addEventListener('click',set3d);
document.getElementById('btnTop').addEventListener('click',setTop);
document.getElementById('btnRoof').addEventListener('click',e=>{roof.visible=!roof.visible;e.currentTarget.classList.toggle('active',roof.visible)});
document.getElementById('btnWalls').addEventListener('click',e=>{walls.visible=!walls.visible;e.currentTarget.classList.toggle('active',walls.visible)});
document.getElementById('btnReset').addEventListener('click',set3d);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
</body>
</html>
